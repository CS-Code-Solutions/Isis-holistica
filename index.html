<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ísis Holística | Loja Esotérica</title>
    <link rel="icon" type="image/png" href="ico.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center cursor-pointer" onclick="mudarAba('view-home')"><img src="logo4.png" class="h-12 md:h-16 w-auto" onerror="this.src='logo.png'"></div>
            <nav class="hidden md:flex space-x-8 text-sm font-semibold items-center">
                <button onclick="mudarAba('view-home')" class="hover:text-[#0E8685]">Início</button>
                <div class="relative group">
                    <button onclick="mudarAba('view-produtos'); filtrarProdutos('todos');" class="hover:text-[#0E8685] py-2">Loja esotérica ▾</button>
                    <div id="desktop-submenu-categorias" class="absolute top-full left-0 w-60 bg-white shadow-xl rounded-2xl py-2 hidden group-hover:block z-50"></div>
                </div>
            </nav>
            <div class="flex items-center gap-3">
                <button onclick="toggleCartModal()" class="relative bg-gray-100 p-2.5 rounded-full hover:bg-gray-200">🛒<span id="cart-count" class="absolute -top-1 -right-1 bg-[#C5A880] text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span></button>
            </div>
        </div>
    </header>

    <section id="view-home" class="app-view flex-grow w-full">
        <div class="bg-[#0b2e2d] text-white py-20 px-6 text-center"><h2 class="text-3xl md:text-5xl font-extrabold mb-4">O equilíbrio começa nos pequenos rituais.</h2><button onclick="mudarAba('view-produtos'); filtrarProdutos('todos');" class="bg-[#0E8685] px-6 py-3 rounded-xl font-bold text-xs">Explorar Loja</button></div>
        <div class="max-w-7xl mx-auto px-4 py-12 w-full"><h3 class="text-2xl font-bold text-gray-900 mb-6">Seleção Ísis</h3><div id="home-destaques-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"></div></div>
    </section>

    <section id="view-produtos" class="app-view hidden flex-grow max-w-7xl mx-auto px-4 py-12 w-full">
        <div class="text-center mb-8"><h3 class="text-2xl font-bold text-[#0E8685]">Loja Esotérica</h3>
            <div class="flex flex-wrap justify-center gap-2 mt-6" id="botoes-filtro-categorias"></div>
        </div>
        <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"></div>
    </section>

    <!-- MODAIS E FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACzkdrx9HUfrOzE-emtGCx4SXLX9w7F4w",
            authDomain: "isis-holistica.firebaseapp.com",
            projectId: "isis-holistica",
            storageBucket: "isis-holistica.firebasestorage.app",
            messagingSenderId: "18451242035",
            appId: "1:18451242035:web:2bc1df8c53716bdbd6a1746"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let listaProdutos = [], todasCategorias = ['Incensos', 'Pedras', 'Semijoias', 'Decoracao', 'Velas', 'Imagens', 'Perfume', 'Oleo Essencial', 'Aromatizador'];
        let categoriaFiltroAtiva = 'todos';

        async function carregarLoja() {
            try {
                // LÊ PRODUTOS (GARANTIDO)
                const snapProd = await getDocs(collection(db, "produtos"));
                snapProd.forEach(d => listaProdutos.push({ idFirestore: d.id, ...d.data() }));

                // LÊ CATEGORIAS ISOLADAMENTE (SE FALHAR, O RESTO FUNCIONA)
                try {
                    const snapCat = await getDocs(collection(db, "categorias"));
                    snapCat.forEach(d => { if(!todasCategorias.includes(d.data().nome)) todasCategorias.push(d.data().nome); });
                } catch(e) { console.warn("Coleção 'categorias' bloqueada. Usando as categorias extraídas dos produtos."); }

                // EXTRAI CATEGORIAS DIRETAMENTE DOS PRODUTOS SE O FIREBASE BLOQUEAR
                listaProdutos.forEach(p => { if(p.categoria && !todasCategorias.includes(p.categoria)) todasCategorias.push(p.categoria); });
                todasCategorias.sort();

                renderizarBotoes();
                renderizarProdutosLoja();
                renderizarDestaquesHome();
            } catch (e) { console.error("Erro fatal ao ler produtos:", e); }
        }
        carregarLoja();

        function renderizarBotoes() {
            let deskHTML = `<button onclick="mudarAba('view-produtos'); filtrarProdutos('todos');" class="block w-full text-left px-4 py-2 hover:bg-teal-50">Todos</button>`;
            let btnHTML = `<button onclick="filtrarProdutos('todos')" id="btn-cat-todos" class="px-4 py-2 rounded-full bg-[#0E8685] text-white text-xs font-bold">Todos</button>`;

            todasCategorias.forEach(cat => {
                deskHTML += `<button onclick="mudarAba('view-produtos'); filtrarProdutos('${cat}');" class="block w-full text-left px-4 py-2 hover:bg-teal-50">${cat}</button>`;
                btnHTML += `<button onclick="filtrarProdutos('${cat}')" id="btn-cat-${cat.replace(/\s+/g,'-')}" class="px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-xs font-bold hover:bg-gray-300">${cat}</button>`;
            });
            document.getElementById('desktop-submenu-categorias').innerHTML = deskHTML;
            document.getElementById('botoes-filtro-categorias').innerHTML = btnHTML;
        }

        window.filtrarProdutos = (cat) => {
            categoriaFiltroAtiva = cat;
            document.querySelectorAll('#botoes-filtro-categorias button').forEach(b => b.className = "px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-xs font-bold");
            const b = document.getElementById(`btn-cat-${cat === 'todos' ? 'todos' : cat.replace(/\s+/g,'-')}`);
            if(b) b.className = "px-4 py-2 rounded-full bg-[#0E8685] text-white text-xs font-bold";
            renderizarProdutosLoja();
        }

        function renderizarProdutosLoja() {
            const cont = document.getElementById('grid-produtos'); cont.innerHTML = '';
            const filt = categoriaFiltroAtiva === 'todos' ? listaProdutos : listaProdutos.filter(p => p.categoria === categoriaFiltroAtiva);
            filt.forEach(p => {
                const img = p.imagens?.[0]?.url || p.imagem || '';
                cont.innerHTML += `<div class="bg-white rounded-2xl shadow p-4"><img src="${img}" class="w-full h-48 object-cover rounded-xl mb-3"><span class="text-xs text-[#0E8685] font-bold">${p.categoria}</span><h4 class="font-bold text-lg">${p.nome}</h4><p class="text-xl font-extrabold text-[#C5A880] mt-2">R$ ${p.preco}</p></div>`;
            });
        }
        function renderizarDestaquesHome() {
            const cont = document.getElementById('home-destaques-grid'); cont.innerHTML = '';
            listaProdutos.filter(p=>p.destaque).forEach(p => {
                cont.innerHTML += `<div class="bg-white rounded-2xl shadow p-4"><img src="${p.imagens?.[0]?.url||p.imagem||''}" class="w-full h-48 object-cover rounded-xl mb-3"><span class="text-xs text-[#0E8685] font-bold">${p.categoria}</span><h4 class="font-bold text-lg">${p.nome}</h4><p class="text-xl font-extrabold text-[#C5A880] mt-2">R$ ${p.preco}</p></div>`;
            });
        }
        window.mudarAba = (id) => { document.querySelectorAll('.app-view').forEach(v=>v.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); window.scrollTo({top:0}); }
    </script>
</body>
</html>
