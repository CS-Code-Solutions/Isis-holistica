<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ísis Holística | Loja Esotérica e Espaço Terapêutico</title>
    <!-- Ícone da Página (Favicon) -->
    <link rel="icon" type="image/png" href="ico.png">
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        #carousel-wrapper {
            position: relative;
            width: 100%;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .carousel-bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
        }

        .carousel-img-pc { display: none; }
        .carousel-img-mobile { display: block; }

        @media (min-width: 768px) {
            .carousel-img-pc { display: block; }
            .carousel-img-mobile { display: none; }
            #carousel-wrapper { min-height: 500px; }
        }

        .carousel-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        .carousel-content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Barra de Aviso Superior -->
    <div class="bg-[#0E8685] text-white text-xs sm:text-sm py-2 px-4 text-center font-medium tracking-wide">
        ✨ Mais que produtos, energia para o seu dia a dia! Conheça nossa curadoria esotérica e terapias holísticas.
    </div>

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center cursor-pointer py-1" onclick="mudarAba('view-home')">
                <img src="logo4.png" alt="Ísis Holística" class="h-16 md:h-24 w-auto object-contain pointer-events-none select-none" draggable="false" oncontextmenu="return false;">
            </div>
            
            <nav class="hidden md:flex space-x-6 text-sm font-semibold items-center">
                <button onclick="mudarAba('view-home')" class="hover:text-[#0E8685] transition">Início</button>
                <button onclick="mudarAba('view-quem-somos')" class="hover:text-[#0E8685] transition">Quem Somos</button>
                
                <div class="relative group py-2">
                    <button onclick="mudarAba('view-produtos'); filtrarProdutos('todos');" class="hover:text-[#0E8685] flex items-center gap-1 transition">Produtos ▾</button>
                    <div class="absolute top-full left-0 w-52 bg-white shadow-xl rounded-xl py-2 hidden group-hover:block border border-gray-100">
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('todos');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-gray-700">Todos os Produtos</button>
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('Promoções');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-amber-600 font-bold">🔥 Promoções</button>
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('Incensos');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-gray-700">🌿 Incensos</button>
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('Pedras');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-gray-700">🔮 Pedras e Cristais</button>
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('Semijoias');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-gray-700">✨ Semijoias</button>
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('Decoracao');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-gray-700">🪷 Decoração</button>
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('Velas');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-gray-700">🕯️ Velas</button>
                        <button onclick="mudarAba('view-produtos'); filtrarProdutos('Imagens (Esculturas)');" class="w-full text-left px-4 py-2 hover:bg-gray-50 text-xs text-gray-700">🗿 Imagens (Esculturas)</button>
                    </div>
                </div>

                <button onclick="mudarAba('view-terapias')" class="bg-teal-50 text-[#0E8685] hover:bg-teal-100 px-4 py-2 rounded-xl transition flex items-center gap-1.5 font-bold border border-teal-200">🪷 Espaço Terapêutico</button>
            </nav>

            <div class="flex items-center gap-2">
                <button onclick="toggleCartModal()" class="relative bg-gray-100 p-2.5 rounded-full hover:bg-gray-200 transition">
                    🛒
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-[#C5A880] text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="toggleMobileMenu()" class="md:hidden bg-gray-100 p-2.5 rounded-lg text-gray-700 font-bold">☰</button>
            </div>
        </div>

        <!-- Menu Mobile -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 px-4 py-4 space-y-3 shadow-lg">
            <button onclick="mudarAba('view-home')" class="block w-full text-left py-2 font-semibold text-gray-700 hover:text-[#0E8685]">Início</button>
            <button onclick="mudarAba('view-quem-somos')" class="block w-full text-left py-2 font-semibold text-gray-700 hover:text-[#0E8685]">Quem Somos</button>
            
            <div class="border-t pt-2 pb-1 text-xs font-bold text-[#0E8685] uppercase">Categorias de Produtos</div>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('todos');" class="block w-full text-left py-1 text-sm text-gray-600 pl-2">📦 Todos os Produtos</button>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('Promoções');" class="block w-full text-left py-1 text-sm text-amber-600 font-bold pl-2">🔥 Promoções</button>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('Incensos');" class="block w-full text-left py-1 text-sm text-gray-600 pl-2">🌿 Incensos</button>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('Pedras');" class="block w-full text-left py-1 text-sm text-gray-600 pl-2">🔮 Pedras e Cristais</button>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('Semijoias');" class="block w-full text-left py-1 text-sm text-gray-600 pl-2">✨ Semijoias</button>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('Decoracao');" class="block w-full text-left py-1 text-sm text-gray-600 pl-2">🪷 Decoração</button>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('Velas');" class="block w-full text-left py-1 text-sm text-gray-600 pl-2">🕯️ Velas</button>
            <button onclick="mudarAba('view-produtos'); filtrarProdutos('Imagens (Esculturas)');" class="block w-full text-left py-1 text-sm text-gray-600 pl-2">🗿 Imagens (Esculturas)</button>
            
            <div class="border-t pt-2"></div>
            <button onclick="mudarAba('view-terapias')" class="w-full text-center bg-teal-50 text-[#0E8685] border border-teal-200 font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                🪷 Espaço Terapêutico
            </button>
        </div>
    </header>

    <!-- ABA 1: INÍCIO -->
    <section id="view-home" class="app-view flex-grow">
        <div id="carousel-wrapper" onclick="clicarBannerAtual()" class="text-white py-24 px-6 text-center overflow-hidden transition-all duration-700">
            <div class="carousel-overlay"></div>
            
            <img id="carousel-img-mobile" class="carousel-bg-image carousel-img-mobile" src="" alt="Banner Mobile">
            <img id="carousel-img-pc" class="carousel-bg-image carousel-img-pc" src="" alt="Banner PC">

            <div class="max-w-3xl mx-auto relative z-10 carousel-content" id="carousel-container">
                <span id="carousel-badge" class="bg-[#C5A880] text-white text-xs font-bold uppercase px-3.5 py-1.5 rounded-full tracking-wider shadow"></span>
                <h2 id="carousel-title" class="text-2xl sm:text-3xl md:text-5xl font-extrabold mt-4 mb-4 leading-tight drop-shadow-md"></h2>
                <p id="carousel-desc" class="text-base sm:text-lg opacity-95 mb-8 max-w-2xl mx-auto drop-shadow"></p>
                <span class="inline-block bg-white/20 backdrop-blur-sm text-white text-xs font-bold px-4 py-2 rounded-full border border-white/30">✨ Clique para explorar</span>
            </div>
            <button onclick="event.stopPropagation(); mudarSlide(-1);" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white p-2.5 rounded-full z-20">❮</button>
            <button onclick="event.stopPropagation(); mudarSlide(1);" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white p-2.5 rounded-full z-20">❯</button>
        </div>

        <!-- Categorias na Home -->
        <div class="max-w-7xl mx-auto px-4 pt-8 pb-4">
            <div class="text-center mb-6">
                <h3 class="text-xl md:text-2xl font-bold text-[#0E8685]">Explore Nossas Categorias</h3>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                <div onclick="mudarAba('view-produtos'); filtrarProdutos('Promoções');" class="
