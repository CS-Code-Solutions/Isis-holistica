<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Ísis Holística</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Cabeçalho do Admin -->
    <header class="bg-[#0E8685] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⚙️</span>
                <h1 class="text-lg md:text-xl font-bold">Painel Gestor | Ísis Holística</h1>
            </div>
            <a href="index.html" class="bg-white text-[#0E8685] font-bold px-4 py-2 rounded-xl text-xs md:text-sm shadow hover:bg-gray-100 transition">
                Ver Loja ao Vivo ➔
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Coluna 1: Formulário para Adicionar/Editar Produto -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 h-fit">
            <h2 class="text-xl font-bold text-[#0E8685] mb-4 flex items-center gap-2">
                <span>📦</span> Adicionar Novo Produto
            </h2>
            <form id="product-form" onsubmit="salvarProduto(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nome do Produto</label>
                    <input type="text" id="prod-nome" required class="w-full px-4 py-2 border rounded-xl text-sm focus:outline-none focus:border-[#0E8685]" placeholder="Ex: Incenso de Alfazema">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Preço (R$)</label>
                    <input type="number" step="0.01" id="prod-preco" required class="w-full px-4 py-2 border rounded-xl text-sm focus:outline-none focus:border-[#0E8685]" placeholder="Ex: 25.00">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Categoria</label>
                    <select id="prod-categoria" class="w-full px-4 py-2 border rounded-xl text-sm focus:outline-none focus:border-[#0E8685]">
                        <option value="Incensos">Incensos</option>
                        <option value="Pedras">Pedras e Cristais</option>
                        <option value="Semijoias">Semijoias</option>
                        <option value="Decoracao">Decoração</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Link da Imagem (URL ou Cloudinary)</label>
                    <input type="url" id="prod-imagem" required class="w-full px-4 py-2 border rounded-xl text-sm focus:outline-none focus:border-[#0E8685]" placeholder="https://exemplo.com/foto.jpg">
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="prod-destaque" class="w-4 h-4 text-[#0E8685] rounded focus:ring-[#0E8685]">
                    <label for="prod-destaque" class="text-sm font-semibold text-gray-700">Deixar em destaque na Página Inicial</label>
                </div>
                <button type="submit" class="w-full bg-[#0E8685] text-white font-bold py-3 rounded-xl hover:bg-opacity-90 transition shadow-lg mt-2">
                    Cadastrar Produto
                </button>
            </form>
        </div>

        <!-- Colunas 2 e 3: Gestão e Lista de Produtos Atuais -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-md border border-gray-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-[#0E8685] flex items-center gap-2">
                    <span>📋</span> Inventário de Produtos
                </h2>
                <span id="total-produtos" class="bg-gray-100 text-gray-700 text-xs font-bold px-3 py-1 rounded-full">0 produtos</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b text-xs font-bold text-gray-400 uppercase">
                            <th class="py-3 px-2">Produto</th>
                            <th class="py-3 px-2">Categoria</th>
                            <th class="py-3 px-2">Preço</th>
                            <th class="py-3 px-2 text-center">Destaque Home</th>
                            <th class="py-3 px-2 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list" class="text-sm divide-y">
                        <!-- Carregado via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-[#1C2833] text-white py-6 text-center text-xs text-gray-400 mt-auto">
        © 2026 Ísis Holística — Painel Administrativo Seguro.
    </footer>

    <!-- Script de Gestão do Admin -->
    <script>
        // Lista padrão inicial caso o localStorage esteja vazio
        let produtosAdmin = JSON.parse(localStorage.getItem('isis_produtos')) || [
            { id: 1, nome: "Incenso Natural Artesanal de Alecrim e Arruda", preco: 18.90, categoria: "Incensos", imagem: "https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=500&auto=format&fit=crop&q=60", destaque: true },
            { id: 2, nome: "Bruto de Ametista Energizada", preco: 42.00, categoria: "Pedras", imagem: "https://images.unsplash.com/photo-1569396111841-311f422c5bcd?w=500&auto=format&fit=crop&q=60", destaque: true },
            { id: 3, nome: "Semijoia Quartzo Verde - Coração", preco: 89.90, categoria: "Semijoias", imagem: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=500&auto=format&fit=crop&q=60", destaque: true }
        ];

        renderizarAdmin();

        function salvarProduto(event) {
            event.preventDefault();
            
            const novoProd = {
                id: Date.now(),
                nome: document.getElementById('prod-nome').value,
                preco: parseFloat(document.getElementById('prod-preco').value),
                categoria: document.getElementById('prod-categoria').value,
                imagem: document.getElementById('prod-imagem').value,
                destaque: document.getElementById('prod-destaque').checked
            };

            produtosAdmin.push(novoProd);
            localStorage.setItem('isis_produtos', JSON.stringify(produtosAdmin));
            
            document.getElementById('product-form').reset();
            renderizarAdmin();
            alert('Produto cadastrado com sucesso!');
        }

        function excluirProduto(id) {
            if (confirm('Tem certeza que deseja remover este produto?')) {
                produtosAdmin = produtosAdmin.filter(p => p.id !== id);
                localStorage.setItem('isis_produtos', JSON.stringify(produtosAdmin));
                renderizarAdmin();
            }
        }

        function renderizarAdmin() {
            const tbody = document.getElementById('admin-product-list');
            const counter = document.getElementById('total-produtos');
            tbody.innerHTML = '';
            counter.innerText = `${produtosAdmin.length} produto(s)`;

            if (produtosAdmin.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-400">Nenhum produto cadastrado.</td></tr>`;
                return;
            }

            produtosAdmin.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-3 px-2 flex items-center gap-3">
                            <img src="${p.imagem}" class="w-10 h-10 object-cover rounded-lg border">
                            <span class="font-semibold text-gray-800">${p.nome}</span>
                        </td>
                        <td class="py-3 px-2 text-gray-600">${p.categoria}</td>
                        <td class="py-3 px-2 font-bold text-[#C5A880]">R$ ${p.preco.toFixed(2).replace('.', ',')}</td>
                        <td class="py-3 px-2 text-center">
                            <span class="px-2 py-1 rounded text-xs font-bold ${p.destaque ? 'bg-teal-100 text-[#0E8685]' : 'bg-gray-100 text-gray-500'}">
                                ${p.destaque ? 'Sim' : 'Não'}
                            </span>
                        </td>
                        <td class="py-3 px-2 text-right">
                            <button onclick="excluirProduto(${p.id})" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
